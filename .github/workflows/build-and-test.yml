name: Build-and-test
on:
  push:
    branches:
      - main
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      retry-registration:
        description: Request registration again for the pending release
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      actions: write
      contents: read

  versionary:
    name: Prepare release and request registration
    needs: [test]
    if: >-
      github.repository_owner == 'jolars' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ github.token }}
      - id: versionary
        uses: jolars/versionary@v1.8.0
        with:
          token: ${{ github.token }}
      - name: Run checks on the release PR
        if: steps.versionary.outputs.action == 'pr-prepared'
        uses: actions/github-script@v8
        env:
          RELEASE_BRANCH: ${{ steps.versionary.outputs.branch }}
        with:
          script: |
            // Explicit dispatch also runs checks for PRs created with GITHUB_TOKEN.
            for (const workflow_id of ['build-and-test.yml', 'documenter.yml']) {
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id, ref: process.env.RELEASE_BRANCH,
              });
            }
      - name: Request Julia registration
        if: >-
          steps.versionary.outputs.release_ready == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.retry-registration &&
           steps.versionary.outputs.action == 'release-waiting')
        uses: actions/github-script@v8
        env:
          RELEASE_TARGETS: ${{ steps.versionary.outputs.release_targets }}
          RETRY_REGISTRATION: ${{ inputs.retry-registration || false }}
        with:
          github-token: ${{ github.token }}
          script: |
            const targets = JSON.parse(process.env.RELEASE_TARGETS);
            const retry = process.env.RETRY_REGISTRATION === "true";
            if (!Array.isArray(targets) || targets.length === 0) {
              throw new Error("Versionary did not supply any external release targets.");
            }
            for (const target of targets) {
              if (!/^(?:[a-f0-9]{40}|[a-f0-9]{64})$/.test(target.sha) ||
                  typeof target.path !== "string" || !target.path ||
                  /\s/.test(target.path) ||
                  typeof target.version !== "string" || !target.version ||
                  typeof target.notes !== "string" || !target.notes.trim()) {
                throw new Error("Invalid external release target.");
              }
              const marker = "<!-- versionary:registrator " +
                JSON.stringify([target.path, target.version, target.sha]) + " -->";
              const comments = await github.paginate(
                github.rest.repos.listCommentsForCommit,
                { ...context.repo, commit_sha: target.sha, per_page: 100 },
              );
              const requested = comments.some(comment =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
              );
              if (requested && !retry) {
                core.info("Registration was already requested for " + target.tag + ".");
                continue;
              }
              const subdir = target.path === "." ? "" : " subdir=" + target.path;
              await github.rest.repos.createCommitComment({
                ...context.repo,
                commit_sha: target.sha,
                body: "@JuliaRegistrator register" + subdir +
                  "\n\nRelease notes:\n\n" + target.notes + "\n\n" + marker,
              });
              core.info("Requested registration for " + target.tag + " at " + target.sha + ".");
            }
